[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ratchet"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ["pyyaml"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]

[tool.setuptools.packages.find]
include = ["ratchet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
